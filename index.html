<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#333333">
  <meta name="color-scheme" content="dark">
  <title>Wall</title>

  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="./styles.css">

  <script>
    try {
      if (window.localStorage.getItem("wall-theme") === "light") {
        document.documentElement.dataset.theme = "light";
      }
    } catch (error) {
    }
  </script>
</head>
<body>
  <main>
    <section id="login-screen" class="screen login-screen" aria-labelledby="login-title">
      <form id="login-form" class="login-card" novalidate>
        <h1 id="login-title" class="login-title">Password</h1>
        <input
          id="password"
          class="password-input"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          autocomplete="current-password"
          aria-label="Password"
          spellcheck="false"
        >
        <button id="login-button" class="login-button" type="submit">Login</button>
        <p id="login-error" class="login-error" role="alert"></p>
      </form>
      <p class="signature" aria-hidden="true">niqonoroff</p>
    </section>

    <section id="wall-screen" class="screen wall-screen" aria-label="Wall" hidden>
      <div
        id="wall-text"
        class="wall-text"
        contenteditable="false"
        data-placeholder="Text"
        role="textbox"
        aria-multiline="true"
        aria-label="Shared notebook"
        spellcheck="false"
        autocapitalize="sentences"
        autocorrect="off"
        translate="no"
      ></div>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div id="wall-actions" class="wall-actions">
        <button id="scroll-bottom-button" class="icon-button" type="button" aria-label="Scroll to the latest messages" title="Scroll to bottom">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
        </button>

        <button id="download-button" class="icon-button" type="button" aria-label="Download chat" title="Download chat">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>

        <button id="theme-button" class="icon-button" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <button id="save-button" class="heart-button" type="button" aria-label="Save" title="Save" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
    </section>

    <section id="signature-modal" class="screen signature-screen" hidden aria-labelledby="signature-title">
      <form id="signature-form" class="login-card signature-card" novalidate>
        <h1 id="signature-title" class="login-title">Your name</h1>
        <input
          id="signature-name"
          class="password-input"
          type="text"
          maxlength="30"
          autocomplete="name"
          aria-label="Your name"
          spellcheck="false"
          autocapitalize="words"
          placeholder="Anonymous"
        >
        <div class="signature-buttons">
          <button id="signature-cancel" class="login-button" type="button">Cancel</button>
          <button id="signature-ok" class="login-button signature-ok" type="submit">Sign</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
