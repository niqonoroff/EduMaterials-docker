<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A shared notebook for the family.">
  <title>Wall</title>

  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Abhaya+Libre:wght@800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <section id="login-screen" class="screen login-screen" aria-labelledby="login-title">
      <form id="login-form" class="login-card" novalidate>
        <h1 id="login-title" class="login-title">Password</h1>
        <input
          id="password"
          class="password-input"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          autocomplete="current-password"
          aria-label="Password"
          spellcheck="false"
        >
        <p id="login-error" class="login-error" role="alert"></p>
      </form>
      <p class="signature" aria-hidden="true">niqonoroff</p>
    </section>

    <section id="wall-screen" class="screen wall-screen" aria-label="Wall" hidden>
      <textarea
        id="wall-text"
        class="wall-text"
        placeholder="Text"
        aria-label="Shared notebook"
        autocomplete="off"
        autocapitalize="sentences"
        autocorrect="off"
        spellcheck="false"
        disabled
      ></textarea>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <button id="save-button" class="heart-button" type="button" aria-label="Save" title="Save" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
